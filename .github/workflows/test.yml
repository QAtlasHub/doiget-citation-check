name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cc
        uses: ./
        with:
          bib: test/references.bib
          allow: test/references.allow
          comment: 'false'
      - name: Assert the two valid DOIs pass the gate
        run: |
          echo "ok=${{ steps.cc.outputs.ok }} broken=${{ steps.cc.outputs.broken }} unverified=${{ steps.cc.outputs.unverified }} fail=${{ steps.cc.outputs.fail }}"
          test "${{ steps.cc.outputs.fail }}" = "0"

  encoding:
    name: Gate survives a non-UTF-8 stdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The report contains em dashes and status emoji. Printing it to a
      # console that cannot encode them (cp932 on a Japanese Windows shell)
      # used to raise UnicodeEncodeError, so the gate exited non-zero with a
      # traceback even when every reference resolved. PYTHONIOENCODING
      # reproduces that on Linux, which makes the regression testable here.
      - name: Clean input exits 0 under ascii / cp932 stdout
        run: |
          set -euo pipefail
          echo '{"entry_key":"a","ok":true,"ref":"10.1038/s41567-020-0932-7","status":"valid"}' > clean.jsonl
          for enc in ascii cp932 utf-8; do
            PYTHONIOENCODING=$enc python3 verify_references_gate.py \
              --allow /dev/null --report report.md < clean.jsonl > out.txt
            ! grep -q Traceback out.txt
            echo "$enc: exit 0, no traceback"
          done

      - name: Broken input still exits 1 under ascii stdout
        run: |
          echo '{"entry_key":"b","ok":false,"ref":"10.1103/PhysRevX.99.999999","status":"absent"}' > bad.jsonl
          set +e
          PYTHONIOENCODING=ascii python3 verify_references_gate.py \
            --allow /dev/null --report report.md < bad.jsonl > /dev/null
          code=$?
          set -e
          test "$code" = "1" || { echo "::error::expected exit 1, got $code"; exit 1; }
          echo "exit 1 as expected — the gate still gates"

  titles:
    name: The title cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exactly the two wrong papers are gated, and nothing else
        run: |
          set -euo pipefail
          rc=0
          python3 verify_references_gate.py \
            --bib test/titles/references.bib --allow /dev/null \
            --titles test/titles/titles.jsonl --title-allow test/titles/title.allow \
            --github-output out.txt < test/titles/verify.jsonl > report.md || rc=$?
          cat report.md
          test "$rc" = "1"
          # The SET, not the count: a rule that flags the right number of the wrong entries
          # passes a count check. WrongPaper resolves to an unrelated title; SharedOpening
          # opens with the bibliography's whole title but continues into it, which is what
          # separates an abbreviation from a different paper.
          got=$(python3 - <<'EOF'
          import re
          keys, on = [], False
          for line in open("report.md"):
              if line.startswith("### ❌ Resolves to a different"): on = True; continue
              if on and line.startswith("###"): break
              m = re.match(r"\|\s*`([A-Za-z]+)`", line)
              if on and m: keys.append(m.group(1))
          print(",".join(sorted(keys)))
          EOF
          )
          test "$got" = "SharedOpening,WrongPaper" || { echo "::error::gated $got"; exit 1; }
          grep -q 'mistitled=2' out.txt
          # The denominator, so a run that compared nothing cannot read as a run that agreed.
          grep -q 'titles_compared=10' out.txt
          grep -q 'title_inconclusive=1' out.txt

      - name: A run that resolved no titles is not a run that agreed
        run: |
          set -euo pipefail
          : > empty.jsonl
          rc=0
          python3 verify_references_gate.py \
            --bib test/titles/references.bib --allow /dev/null \
            --titles empty.jsonl --title-allow test/titles/title.allow \
            --github-output outage.txt < test/titles/verify.jsonl > outage.md || rc=$?
          test "$rc" = "0"
          grep -q 'titles_compared=0' outage.txt
          grep -q 'titles compared: \*\*0\*\*' outage.md
          # …and it must not look like the check being switched off.
          python3 verify_references_gate.py \
            --bib test/titles/references.bib --allow /dev/null \
            --github-output off.txt < test/titles/verify.jsonl > off.md
          grep -q 'mistitled=0' off.txt
          if diff -q outage.md off.md > /dev/null; then
            echo "::error::an outage renders identically to the check being off"; exit 1
          fi

      - name: resolve_titles survives every shape doiget can return
        run: |
          set -euo pipefail
          export PATH="$PWD/test/stub:$PATH"
          python3 resolve_titles.py --timeout 5 < test/stub/verify.jsonl > got.jsonl
          diff -u test/stub/expected.jsonl got.jsonl
          # And with no doiget at all: a reason per entry, not a crash and not silence.
          env PATH=/usr/bin:/bin python3 resolve_titles.py --timeout 5 \
            < test/stub/verify.jsonl > nobin.jsonl
          test "$(grep -c 'doiget not on PATH' nobin.jsonl)" = "5"
